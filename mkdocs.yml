site_name: MGB Model
site_description: Documentation for the MGB large-scale hydrological model
site_url: https://hge-iph.github.io/MGB-model/
repo_url: https://github.com/HGE-IPH/MGB-model
repo_name: HGE-IPH/MGB-model
edit_uri: edit/main/docs/

theme:
  name: readthedocs

plugins:
  - search

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Model:
      - Overview: model/overview.md
      - Concepts and discretization: model/model-concepts.md
      - Energy balance and evapotranspiration: model/energy-balance.md
      - Soil and catchment processes: model/soil-and-catchment-processes.md
      - River routing:
          - Overview: model/river-routing.md
          - Muskingum-Cunge: model/muskingum-cunge-routing.md
          - Local-inertial: model/local-inertial-routing.md
      - Parameters and initial state: model/parameters-and-initial-state.md
      - Processes and numerical assumptions: model/model-processes.md
      - Scientific references: model/references.md
  - Architecture:
      - Overview: architecture/architecture.md
      - Components and dependencies: architecture/components-and-dependencies.md
      - Execution and data flow: architecture/execution-and-data-flow.md
      - I/O reference: architecture/io-reference.md
      - Design decisions: architecture/design-decisions.md
  - Legacy migration reference:
      - Overview: migration/overview.md
      - Source files and modules: migration/source-files.md
      - Routines and execution flow: migration/routines-and-flow.md
      - Shared variables and terminology: migration/shared-variables.md
      - Runtime names: migration/runtime-names.md
  - Development:
      - Setup and build: development/build.md
      - Testing and debugging: development/testing.md
      - Automation and documentation: development/continuous-integration.md
      - Coding conventions: development/coding-conventions.md
      - Contributing: https://github.com/HGE-IPH/MGB-model/blob/main/CONTRIBUTING.md
