site_name: MGB Model
site_description: Documentation for the MGB large-scale hydrological model
site_url: https://hge-iph.github.io/MGB-model/
repo_url: https://github.com/HGE-IPH/MGB-model
repo_name: HGE-IPH/MGB-model
edit_uri: edit/main/docs/

theme:
  name: mkdocs

plugins:
  - search

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting started:
      - Build: getting-started/build.md
      - Testing: getting-started/testing.md
  - Model:
      - Concepts and discretization: model/model-concepts.md
      - Energy balance and evapotranspiration: model/energy-balance.md
      - Soil and catchment processes: model/soil-and-catchment-processes.md
      - River routing: model/river-routing.md
      - Parameters and initial state: model/parameters-and-initial-state.md
      - Processes and numerical assumptions: model/model-processes.md
      - I/O reference: model/io-reference.md
      - Portability: model/portability.md
  - Development:
      - Architecture: development/architecture.md
      - Design decisions: development/design-decisions.md
      - Language and naming: development/language-and-naming.md
      - Fortran style: development/fortran-style.md
  - Project:
      - History and contributors: project/project-history.md
      - References: project/references.md
  - Contributing: https://github.com/HGE-IPH/MGB-model/blob/main/CONTRIBUTING.md
