name: Regression GNU Fortran

on:
  pull_request:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-magdalena:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install GNU Fortran
        run: |
          sudo apt-get update
          sudo apt-get install --yes gfortran-13
          gfortran-13 --version

      - name: Configure GNU Fortran Build
        run: FC=gfortran-13 cmake -S . -B build/linux-gfortran -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/linux-gfortran --parallel

      - name: Run Regression Tests
        run: ctest --test-dir build/linux-gfortran --output-on-failure

      - name: Upload Regression Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-gfortran-logs
          if-no-files-found: ignore
          path: build/linux-gfortran/Testing/Temporary/LastTest.log
