name: Fortran format

on:
  pull_request:
    types: [opened, reopened]
  push:    
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install formatter
        run: python -m pip install -r requirements-dev.txt

      - name: Check Fortran formatting
        run: python scripts/check_fortran_format.py

      - name: Check Fortran architecture
        run: python scripts/check_fortran_architecture.py

      - name: Test architecture checker
        run: python -m unittest discover -s tests/architecture
